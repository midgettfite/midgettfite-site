people:
  - name: Dan Midgett
    title: Principal Broker
    photo: /img/team-dan.jpg
    bio: Dan E. Midgett, II is a full service real estate broker serving residential
      and commercial clients, and is the Managing Owner of Midgett & Fite. He
      strives to provide top-level service to his clients and to treat everyone
      with respect. Dan is an award-winning real estate broker serving Wilson
      and surrounding counties, including the Nashville MSA. He has achieved the
      Gold Award of Excellence multiple times, culminating in the Gold Life
      Award. Dan received his CCIM designation in 2008 and is a certified
      negotiation expert. Dan's list of commercial clients includes Southern
      Baptist Theological Seminary, AAA Self-Storage, and Farm Bureau Insurance
      Company, among others. Dan co-brokered finding a site for Publix in
      Lebanon and continues to help many local businesses and individuals
      achieve their real estate dreams. Whether you are relocating your business
      or buying your first home, Dan can help.
  - name: Jeneva Midgett
    title: Real Estate Agent / Property Management Specialist
    photo: /img/team-jeneva.jpg
    bio: Jeneva has had a behind-the-scenes role in the operation of the company
      almost from its beginning. She obtained her real estate license in 2016
      and is now the specialist for all of the property management needs of
      Midgett & Fite.
  - name: Nate Midgett
    title: Maintenance Manager
    photo: /img/team-nate.jpg
    bio: Nate joined Midgett & Fite in 2024. His varied background in the
      development, design, construction, and management of properties adds to
      the valuable service he offers to our clients.
  - name: Jeanice Birch
    title: Office Assistant
    photo: /img/team-jeanice.jpg
    bio: Jeanice joined the Midgett & Fite team in 2020. Her background in
      journalism and in customer service helps her serve our office, owners,
      tenants, and brokerage clients with knowledge and kindness.
